services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agencyops}
      POSTGRES_USER: ${POSTGRES_USER:-agencyops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "pnpm --filter @agencyops/api exec prisma generate &&
      pnpm --filter @agencyops/shared build &&
      pnpm --filter @agencyops/api exec prisma migrate deploy &&
      pnpm --filter @agencyops/api start"
    ports:
      - "127.0.0.1:${AGENCYOPS_API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health | grep ok"]
      interval: 20s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      sh -c "pnpm --filter @agencyops/api exec prisma generate &&
      pnpm --filter @agencyops/shared build &&
      pnpm --filter @agencyops/api worker:prod"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_PUBLIC_ORGANIZATION_SLUG: ${VITE_PUBLIC_ORGANIZATION_SLUG:-northstar-digital-agency}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AGENCYOPS_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
