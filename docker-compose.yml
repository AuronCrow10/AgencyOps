services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agencyops
      POSTGRES_USER: agencyops
      POSTGRES_PASSWORD: agencyops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencyops -d agencyops"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "pnpm --filter @agencyops/api exec prisma generate &&
      pnpm --filter @agencyops/shared build &&
      pnpm --filter @agencyops/api exec prisma migrate deploy &&
      pnpm --filter @agencyops/api start"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health | grep ok"]
      interval: 20s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: >
      sh -c "pnpm --filter @agencyops/api exec prisma generate &&
      pnpm --filter @agencyops/shared build &&
      pnpm --filter @agencyops/api worker:prod"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_PUBLIC_ORGANIZATION_SLUG: ${VITE_PUBLIC_ORGANIZATION_SLUG:-northstar-digital-agency}
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
